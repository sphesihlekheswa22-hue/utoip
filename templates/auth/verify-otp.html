{% extends "layouts/auth.html" %}
{% block title %}Verify OTP{% endblock %}
{% block content %}
<h2>Verify code</h2>
<p class="lede">Enter the 6-digit code sent to your email or authenticator.</p>
<form method="post" class="auth-form" data-validate>
  <div class="field"><label for="otp">One-time code</label><input id="otp" name="otp" inputmode="numeric" maxlength="6" required placeholder="••••••" /></div>
  <button type="submit" class="btn btn-primary auth-submit">Verify</button>
</form>
<p class="auth-links"><a href="{{ url_for('auth.login') }}">Cancel</a></p>
{% endblock %}
