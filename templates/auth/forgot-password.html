{% extends "layouts/auth.html" %}
{% block title %}Forgot password{% endblock %}
{% block content %}
<h2>Forgot password</h2>
<p class="lede">We will email a reset link to your municipal account.</p>
<form method="post" class="auth-form" data-validate>
  <div class="field"><label for="email">Email</label><input id="email" name="email" type="email" required /></div>
  <button type="submit" class="btn btn-primary auth-submit">Send reset link</button>
</form>
<p class="auth-links"><a href="{{ url_for('auth.login') }}">Back to sign in</a></p>
{% endblock %}
