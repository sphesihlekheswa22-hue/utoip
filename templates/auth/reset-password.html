{% extends "layouts/auth.html" %}
{% block title %}Reset password{% endblock %}
{% block content %}
<h2>Reset password</h2>
<p class="lede">Choose a strong password for your UITOP account.</p>
<form method="post" class="auth-form" data-validate>
  <div class="field"><label for="password">New password</label><input id="password" name="password" type="password" required /></div>
  <div class="field"><label for="confirm">Confirm password</label><input id="confirm" name="confirm" type="password" required /></div>
  <button type="submit" class="btn btn-primary auth-submit">Update password</button>
</form>
{% endblock %}
