{% extends "layouts/auth.html" %}
{% block title %}MFA{% endblock %}
{% block content %}
<h2>Multi-factor authentication</h2>
<p class="lede">Approve the sign-in request or enter an authenticator code.</p>
<form method="post" class="auth-form" data-validate>
  <div class="field"><label for="mfa">Authenticator code</label><input id="mfa" name="mfa" inputmode="numeric" maxlength="6" required /></div>
  <button type="submit" class="btn btn-primary auth-submit">Continue</button>
</form>
<p class="auth-links"><a href="{{ url_for('auth.login') }}">Use a different account</a></p>
{% endblock %}
