<div class="modal" id="uitop-modal" hidden>
  <div class="modal-backdrop" data-modal-close></div>
  <div class="modal-dialog" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <header class="modal-header">
      <h2 id="modal-title">Dialog</h2>
      <button type="button" class="btn btn-ghost btn-sm" data-modal-close aria-label="Close">&times;</button>
    </header>
    <div class="modal-body" id="modal-body"></div>
    <footer class="modal-footer">
      <button type="button" class="btn btn-secondary" data-modal-close>Cancel</button>
      <button type="button" class="btn btn-primary" id="modal-confirm">Confirm</button>
    </footer>
  </div>
</div>
