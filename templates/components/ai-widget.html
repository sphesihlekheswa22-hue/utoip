<div class="ai-widget" id="ai-widget" hidden>
  <header class="ai-widget-header">
    <strong><i class="fas fa-sparkles"></i> UITOP AI</strong>
    <button type="button" class="btn btn-ghost btn-sm" data-ai-close aria-label="Close">&times;</button>
  </header>
  <div class="ai-widget-body">
    <p class="ai-bubble">Ask about assets, alerts, or troubleshooting steps.</p>
  </div>
  <form class="ai-widget-form" onsubmit="return false;">
    <input type="text" placeholder="Ask UITOP AI…" aria-label="AI prompt" />
    <button type="submit" class="btn btn-primary btn-sm"><i class="fas fa-paper-plane"></i></button>
  </form>
</div>
