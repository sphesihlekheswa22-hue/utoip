# Render Blueprint — https://render.com/docs/blueprint-spec
# Connect repo: https://github.com/sphesihlekheswa22-hue/utoip
services:
  - type: web
    name: utoip
    runtime: python
    plan: free
    region: frankfurt
    buildCommand: pip install -r requirements.txt
    preDeployCommand: flask db upgrade
    startCommand: gunicorn wsgi:app --bind 0.0.0.0:$PORT --workers 2 --timeout 120
    healthCheckPath: /login
    envVars:
      - key: FLASK_APP
        value: app:app
      - key: FLASK_ENV
        value: production
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: DEMO_MODE
        value: "false"
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: utoip-db
          property: connectionString

databases:
  - name: utoip-db
    plan: free
    databaseName: utoip
    user: utoip
