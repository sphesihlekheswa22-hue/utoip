# Render Blueprint — https://render.com/docs/blueprint-spec
# Connect repo: https://github.com/sphesihlekheswa22-hue/utoip
services:
  - type: web
    name: utoip
    runtime: python
    plan: free
    # Web app region (EU). Postgres is `oregon` below — app expands internal DB host via RENDER_PG_REGION.
    region: frankfurt
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn wsgi:app --bind 0.0.0.0:$PORT --workers 1 --timeout 120 --preload
    healthCheckPath: /login
    envVars:
      - key: FLASK_APP
        value: app:app
      - key: FLASK_ENV
        value: production
      - key: BOOTSTRAP_DB
        value: "true"
      - key: RENDER_PG_REGION
        value: oregon
      - key: DATABASE_HOST
        fromDatabase:
          name: utoip-db
          property: host
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: DEMO_MODE
        value: "false"
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: utoip-db
          property: connectionString

databases:
  - name: utoip-db
    plan: free
    region: oregon
    databaseName: utoip
    user: utoip
